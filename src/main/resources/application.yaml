spring:
  application:
    name: platforms
  datasource:
    url: jdbc:postgresql://localhost:5432/platforms_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8082
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8085}
users:
  service:
    url: ${USERS_SERVICE_URL:http://localhost:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:11000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:platforms}